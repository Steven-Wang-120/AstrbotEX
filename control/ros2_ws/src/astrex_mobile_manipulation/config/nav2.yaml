/astrex/mm/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_planning_time: 2.0
/astrex/mm/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /astrex/mm/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.60
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.5
      max_robot_pose_search_dist: 5.0
      transform_tolerance: 0.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.04
      min_approach_linear_velocity: 0.03
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false
/astrex/mm/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 10.0
    publish_frequency: 5.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    robot_radius: 0.48
    transform_tolerance: 0.2
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /astrex/mm/scan
        data_type: LaserScan
        marking: true
        clearing: true
        obstacle_max_range: 5.0
        obstacle_min_range: 0.10
        raytrace_max_range: 6.0
        raytrace_min_range: 0.10
        max_obstacle_height: 2.0
        inf_is_valid: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.60
      cost_scaling_factor: 3.0
    always_send_full_costmap: true
/astrex/mm/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    resolution: 0.05
    robot_radius: 0.48
    track_unknown_space: true
    transform_tolerance: 0.2
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /astrex/mm/map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /astrex/mm/scan
        data_type: LaserScan
        marking: true
        clearing: true
        obstacle_max_range: 5.0
        obstacle_min_range: 0.10
        raytrace_max_range: 6.0
        raytrace_min_range: 0.10
        max_obstacle_height: 2.0
        inf_is_valid: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.60
      cost_scaling_factor: 3.0
/astrex/mm/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /astrex/mm/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
/astrex/mm/behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    enable_stamped_cmd_vel: true
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5
/astrex/mm/collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: nav_cmd_vel
    cmd_vel_out_topic: collision_checked_cmd_vel
    enable_stamped_cmd_vel: true
    transform_tolerance: 0.2
    source_timeout: 0.2
    stop_pub_timeout: 1.0
    base_shift_correction: true
    polygons: [StopCircle]
    StopCircle:
      type: circle
      radius: 0.50
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /astrex/mm/scan
      enabled: true
/astrex/mm/map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
