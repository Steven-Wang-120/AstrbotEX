[project]
name = "astrbotex"
version = "0.1.0"
description = "AstrBotEX local embodied robotics runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyzmq>=26.0.0",
  "websockets>=14.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
